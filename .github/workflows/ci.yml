name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate shell scripts
        run: bash -n script/*.sh script/tests/*.sh
      - name: Run installer process harness
        run: ./script/tests/installer_process_harness.sh
      - name: Verify release contract
        run: bash script/tests/release_contract_harness.sh
      - name: Snapshot state before tests
        run: ./script/check_test_leftovers.sh snapshot "$RUNNER_TEMP/test-leftovers"
      - name: Run tests
        env:
          COPYCLIP_DEFAULTS_DIAGNOSTICS_FILE: ${{ runner.temp }}/defaults-diagnostics.txt
        run: ./script/check_coverage.sh
      - name: Fail on files left by tests
        if: always()
        env:
          COPYCLIP_ENFORCE_NO_TEST_LEFTOVERS: "1"
        run: ./script/check_test_leftovers.sh report "$RUNNER_TEMP/test-leftovers"
      - name: Probe cfprefsd cleanup behaviour (temporary)
        if: always()
        continue-on-error: true
        run: |
          swift script/tests/defaults_probe.swift write "$RUNNER_TEMP/defaults-probe.txt" "$RUNNER_TEMP"
          sleep 5
          swift script/tests/defaults_probe.swift check "$RUNNER_TEMP/defaults-probe.txt"
          diagnostics="$RUNNER_TEMP/defaults-diagnostics.txt"
          echo "== Suites by instance state at teardown (all / left behind):"
          cut -f2 "$diagnostics" | sort | uniq -c
          while IFS=$'\t' read -r suite state test; do
            if [[ -e "$HOME/Library/Preferences/$suite.plist" ]]; then
              echo "LEFT $state $test"
            fi
          done <"$diagnostics" | sort | uniq -c | sort -rn | head -60
          echo "== Clean suites by test (first 40):"
          while IFS=$'\t' read -r suite state test; do
            if [[ ! -e "$HOME/Library/Preferences/$suite.plist" ]]; then
              echo "CLEAN $state $test"
            fi
          done <"$diagnostics" | sort | uniq -c | sort -rn | head -40
      - name: Enforce strict concurrency warnings
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build local release artifact
        run: |
          COPYCLIP_RELEASE_MODE=local \
          COPYCLIP_BUILD_NUMBER="${{ github.run_number }}" \
          ./script/package_release.sh
      - name: Verify universal binary
        run: |
          ARCHS="$(lipo -archs 'dist/staging.noindex/CopyClip Lite.app/Contents/MacOS/CopyClipLite')"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
      - name: Upload local validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CopyClip-Lite-local-validation
          path: dist/CopyClip-Lite-macOS.zip
